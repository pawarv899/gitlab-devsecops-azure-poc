{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: v1
kind: Service
metadata:
  # Name MUST equal the service's short name exactly (config-server,
  # discovery-server, ...) - the application's own externalized config
  # hardcodes http://discovery-server:8761/eureka/ and each module's own
  # application.yml defaults CONFIG_SERVER_URL to a config-server
  # hostname; same-namespace Kubernetes DNS resolves these short names
  # directly, so no override beyond env.CONFIG_SERVER_URL in values.yaml
  # is needed.
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
---
{{- end }}
{{- end }}
