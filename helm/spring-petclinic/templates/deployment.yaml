{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
spec:
  replicas: 1
  # maxSurge: 0 / maxUnavailable: 1 - the old pod terminates before the
  # new one is created during a rollout, instead of briefly running both
  # (the default maxSurge:1 behavior). On a single small node, this
  # avoids momentarily double-counting a Deployment's CPU/memory
  # requests during a redeploy, at the cost of brief downtime during
  # updates - see docs/production-readiness.md.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/spring-petclinic-{{ $name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          {{- if $svc.env }}
          env:
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ $svc.healthPath }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: {{ $svc.healthPath }}
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ $svc.healthPath }}
              port: http
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ $svc.resources.requests.cpu }}
              memory: {{ $svc.resources.requests.memory }}
            limits:
              cpu: {{ $svc.resources.limits.cpu }}
              memory: {{ $svc.resources.limits.memory }}
---
{{- end }}
{{- end }}
